<body class="font-body-md text-on-surface selection:bg-secondary-container">

</div>
<div>

<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>

</div>
</div>

<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<span class="font-label-md text-label-md text-on-surface-variant">午休</span>
</div>

</div>
<div>

<!-- Micro-interactions Script -->
<script>
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const card = this.closest('.alarm-card');
                if (this.checked) {
                    card.classList.remove('opacity-60', 'bg-surface-container-low');
                    card.classList.add('bg-surface-container-lowest', 'shadow-[0_4px_12px_rgba(79,70,229,0.04)]');
                } else {
                    card.classList.add('opacity-60', 'bg-surface-container-low');
                    card.classList.remove('bg-surface-container-lowest', 'shadow-[0_4px_12px_rgba(79,70,229,0.04)]');
                }
            });
        });

        // Simple haptic-like scale effect on click for alarm items
        document.querySelectorAll('.alarm-card').forEach(card => {
            card.addEventListener('mousedown', () => card.style.transform = 'scale(0.98)');
            card.addEventListener('mouseup', () => card.style.transform = 'scale(1)');
            card.addEventListener('mouseleave', () => card.style.transform = 'scale(1)');
        });
    </script>
</body></html>
